name: release

# Cut a release by pushing a version tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# This builds a self-contained single-file Windows x64 exe and attaches it to a GitHub Release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}   # allow manual runs from the Actions tab

permissions:
  contents: write          # needed to create the Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish distributable release bundle
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          ./release.ps1 -Version $ver -NoPause

      - name: Upload release zip
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart('v')
          Copy-Item "release/POE2Radar-v$ver-win-x64.zip" "POE2Radar-$tag-win-x64.zip" -Force

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: POE2Radar-*-win-x64.zip
          generate_release_notes: true
